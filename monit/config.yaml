name: "Monit"
description: >-
  Monit is an open source utility for managing and monitoring, processes, programs, files, directories and filesystems on a UNIX system. Monit conducts automatic maintenance and repair and can execute meaningful causal actions in error situations.
url: "https://github.com/MMonit/monit"
version: "0.0.2"
slug: "monit"
arch:
  # - aarch64
  - amd64
map:
  # FIXME: Setup app_config? ref: https://contributors.home-assistant.io/apps/reference/configuration/#folders
  - type: app_config
    read_only: false
watchdog: "http://[HOST]:[PORT:2812]/_ping"
ingress: true
ingress_port: 2812
panel_title: Monit
panel_icon: cbi:monit
ports:
  2812/tcp: null
ports_description:
  2812/tcp: "Monit's http listener"
schema:
  monitrc: str
options:
  monitrc: |
    set daemon 120
    set init  # FIXME: Launch with '-I' argument instead
    set log /dev/stdout
    # set pidfile  # FIXME: Confirm this doesn't matter?
    set idfile /data/monit_id
    set statefile /data/monit_state

    # Do not overwrite this, use Home Assistant's port forward stuff instead
    set httpd port 2812 and
        allow 0.0.0.0/0    # FIXME: IPv6?

    check host "Home Assistant"
      address supervisor
      if failed ping then alert
      if failed
        port 80
        protocol http
        # request '/info'
        # with http headers [Authorization: Bearer {SUPERVISOR_TOKEN}]
        # # NOTE: This assumes 'result' is always the first key in the json response.
        # #       This has been true in my system, but I don't think that's documented & reliable behaviour
        # content = '^\{{"result":"ok",.*\}}$'
        request '/supervisor/ping'
        # FIXME: This is a somewhat dodgy attempt at handling JSON properly regardless of whitespace... this should probably just go away.
        content = '^\{{[[:space:]]*"result"[[:space:]]*:[[:space:]]*"ok"[[:space:]]*,[[:space:]]*"data"[[:space:]]*:[[:space:]]*\{{[[:space:]]*\}}[[:space:]]*\}}$'
        then alert
